<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Harness minimal example</title>
    <link rel="stylesheet" href="/style.css">
    <script defer src="/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Harness demo</p>
        <h1>A small, steerable flow</h1>
        <p class="intro">A two-step example with a deliberate app control surface.</p>
      </header>
      <p id="progress" class="progress" aria-live="polite"></p>
      <section id="details" aria-labelledby="details-title">
        <h2 id="details-title">Welcome</h2>
        <label for="name">Your name</label>
        <input id="name" name="name" autocomplete="name">
        <button id="continue" type="button" disabled>Continue</button>
      </section>
      <section id="complete" aria-labelledby="complete-title" hidden>
        <h2 id="complete-title">You're all set, <span id="greeting"></span>.</h2>
        <p>Your progress is complete.</p>
        <button id="back" class="secondary" type="button">Back</button>
      </section>
      <p class="footnote">This example exposes state and actions only with <code>?harness=1</code>.</p>
    </main>
  </body>
</html>
