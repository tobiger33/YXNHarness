<title id="title">YXN — Loading</title>
<style>
:root{color-scheme:light dark;color:#252525}@media(prefers-color-scheme:dark){:root{color:#e8e8e8}}
.a{animation:join-left 1.8s cubic-bezier(.4,0,.2,1) infinite}.b{animation:join-right 1.8s cubic-bezier(.4,0,.2,1) infinite}.c{animation:join-base 1.8s cubic-bezier(.4,0,.2,1) infinite}
